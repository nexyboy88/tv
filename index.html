<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@200;300;400;500;600;700&display=swap">
<style>
  /* ===== Nordisk mørkt tema (lyst tema kan vælges med THEME) ===== */
  :root { --wood: 164, 122, 78; --r: 14px; --r-sm: 8px; }   /* samme runde hjørner overalt */
  body.dark {
    --bg: #1B1A18; --chip: rgba(239, 235, 228, 0.07); --line: rgba(239, 235, 228, 0.10); --text: #EFEBE4; --soft: #CFC9C0;
    --muted: #A39D94; --accent: #D2AE80; --green: #9CC7A3; --shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
  }
  body.light {
    --bg: #ECE7DF; --chip: rgba(38, 36, 31, 0.05); --line: rgba(38, 36, 31, 0.10); --text: #26241F; --soft: #48443D;
    --muted: #6B655C; --accent: #8C6239; --green: #3F7A4C; --shadow: 0 10px 30px rgba(38, 36, 31, 0.10);
  }
  /* Sæsontemaer – lægger sig oven på det mørke tema */
  body.s-halloween   { --bg: #17131A; --accent: #EE9445; --line: rgba(238, 148, 69, 0.16);  --wood: 238, 148, 69; }
  body.s-jul         { --bg: #111814; --accent: #E2B969; --line: rgba(226, 185, 105, 0.14); --wood: 200, 70, 60; }
  body.s-nytaar      { --bg: #13141B; --accent: #E8C77E; --line: rgba(232, 199, 126, 0.14); --wood: 232, 199, 126; }
  body.s-paaske      { --bg: #16170F; --accent: #E7CB5F; --line: rgba(231, 203, 95, 0.14);  --wood: 160, 190, 110; }
  body.s-fastelavn   { --accent: #E9A9C9; --line: rgba(233, 169, 201, 0.14); --wood: 233, 169, 201; }
  body.s-fodselsdag  { --accent: #F0B85A; --line: rgba(217, 72, 74, 0.20);   --wood: 217, 72, 74; }
  body.s-sankthans   { --bg: #19140F; --accent: #F2A04A; --line: rgba(242, 160, 74, 0.15);  --wood: 242, 160, 74; }
  body.s-sommerferie { --bg: #15170F; --accent: #F2C858; --line: rgba(242, 200, 88, 0.14);  --wood: 242, 200, 88; }
  body.s-skolestart  { --accent: #8FB8E8; --line: rgba(143, 184, 232, 0.16); --wood: 143, 184, 232; }

  html, body { margin: 0; height: 100%; background: #1B1A18; overflow: hidden; cursor: none; }
  body { background: var(--bg, #1B1A18); }   /* samme farve som skærmen helt ud i kanten */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: 'Albert Sans', system-ui, sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  /* I dag-kolonnen: samme farve som båndet fra top til bund (i to stykker, så båndet ikke bliver dobbelt farvet) */
  .colbg { position: absolute; left: 0; width: 280px; background: rgba(var(--wood), 0.16); }
  .label { font-size: 14px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .ico { display: flex; flex: none; }

  /* Sæsonpynt og ramme */
  #fx, #deco { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
  #deco { z-index: 4; }
  /* Rolig zone i venstre kolonne (I DAG øverst, vejret nederst): pynt og animation er kun svagt synlige dér */
  #deco svg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  #deco .tw { animation: tw 2.6s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  #deco .spider { animation: bob 7s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(14px); } }
  #deco .hop { animation: hop 3s ease-in-out infinite; transform-box: fill-box; }
  @keyframes hop { 0%, 80%, 100% { transform: translateY(0); } 90% { transform: translateY(-6px); } }
  .glow { display: none; }   /* ingen brun kant rundt om skærmen – mere plads til indholdet */

  /* ===== Øverst: 6 dage som kort – i dag, i morgen, i overmorgen øverst og de næste 3 under ===== */
  #top { position: absolute; left: 16px; right: 16px; top: 14px; height: 633px; }
  #week { height: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 376px 235px; column-gap: 10px; row-gap: 14px; }   /* øverste 3 dage 20 % højere, nederste 25 % lavere */
  .day { display: flex; flex-direction: column; gap: 2px; padding: 12px 22px; min-width: 0; min-height: 0; overflow: hidden;
    border-radius: var(--r); background: rgba(239, 235, 228, 0.07); }   /* de 3 øverste dage (også i dag) */
  #week > .day:nth-child(n+4) { background: rgba(239, 235, 228, 0.018); }   /* de 3 nederste dage lidt mørkere */
  #week > .day:nth-child(n+4) { gap: 2px; padding-top: 10px; padding-bottom: 8px; }   /* de nederste kort er lavere – lidt tættere, så der er plads til 3–4 aftaler */
  #week > .day:nth-child(n+4) .dh { padding-bottom: 6px; margin-bottom: 4px; }
  #week > .day:nth-child(n+4) .dh .nm { font-size: 29px; }
  #week > .day:nth-child(n+4) .ev { min-height: 34px; }
  .dh { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid rgba(239, 235, 228, 0.12); flex: none; }
  .dl { display: flex; align-items: baseline; gap: 10px; min-width: 0; }   /* ugedag og dato på samme linje */
  .dh .nm { font-size: 32px; font-weight: 800; line-height: 1; letter-spacing: 0.02em; color: var(--text); white-space: nowrap; }
  .dh .num { font-size: 20px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .dwi { flex: 1; display: flex; justify-content: flex-end; align-items: center; }
  .dwi svg { flex: none; display: block; }
  .tt { display: flex; align-items: center; line-height: 1; white-space: nowrap; }
  .tt b { font-size: 29px; font-weight: 700; }
  /* Én linje pr. aftale i 3 faste kolonner: klokkeslæt · bogstaver · tekst */
  .ev { flex: none; display: grid; grid-template-columns: 76px 68px minmax(0, 1fr); column-gap: 12px; align-items: center; min-height: 36px; }   /* plads til 3 bogstaver */
  .ev .tm { font-size: 25px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ev .ic { display: flex; gap: 4px; }
  .ev .ic .who:nth-child(2):nth-last-child(2), .ev .ic .who:nth-child(3) { margin-left: -12px; box-shadow: 0 0 0 2px #22201D; }   /* sjældent 3 personer: bogstaverne lægger sig lidt ind over hinanden */
  .ev .who { flex: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: #1B1A18; letter-spacing: 0; }
  .ev .x { font-size: 30px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.past { opacity: 0.4; }   /* aftaler, der er slut */
  /* NU-linjen i I DAG: står mellem det, der er sket, og det, der kommer – flytter sig i løbet af dagen */
  .nowline { flex: none; display: flex; align-items: center; gap: 10px; margin: 2px 0; color: var(--accent); font-size: 16px; font-weight: 800; letter-spacing: 0.18em; }
  .nowline::after { content: ''; flex: 1; height: 2px; border-radius: 2px; background: var(--accent); opacity: 0.8; }
  .ev.dinner .who { background: #E6C34A; }   /* aftensmad: bestik-ikon i madfarve */
  .day.free .dh { opacity: 0.42; }   /* dage uden aftaler nedtones */
  .day.free::after { content: 'Ingen aftaler'; font-size: 22px; font-weight: 600; color: var(--muted); opacity: 0.45; }
  .more, .empty { font-size: 22px; font-weight: 700; color: var(--muted); flex: none; }

  /* ===== Båndet: ur · vits · citat · vidste du – i samme kolonner som dagene ===== */
  #band { position: absolute; left: 0; right: 0; top: 661px; height: 100px; background: rgba(var(--wood), 0.16); }
  .seg { min-width: 0; padding: 6px 14px 5px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  .seg:first-child { padding-left: 0; }
  .seg.c2 { grid-column: span 2; justify-content: center; }   /* overskrift + tekst samlet centreret i højden */
  .seg.clk { position: absolute; left: 38px; top: 0; bottom: 0; justify-content: center; overflow: visible; padding: 0; }   /* uret flugter med dagenes tekst */
  .seg.clk + .seg { padding-left: 30px; }   /* lidt luft til det store ur */
  .seg:last-child { padding-right: 0; }
  #clock { font-size: 84px; font-weight: 600; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; text-align: center; transform: translateY(-4px); }   /* tal har ingen underlængder – løftes en anelse */
  .sh2 { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--accent); flex: none; }
  .sh2 .label { color: var(--accent); font-size: 19px; }
  .txt { flex: 0 1 auto; min-height: 0; text-align: center; font-size: 24px; font-weight: 500; line-height: 1.12; overflow: hidden; transition: opacity 0.6s; }
  .txt.fade { opacity: 0; }
  .txt .a { color: var(--muted); }
  /* Båndet: én ting ad gangen – 5 slags indslag skifter hvert 10. minut, samme indslag hele dagen */
  .seg.one { position: absolute; top: 0; bottom: 0; left: 50%; width: 1000px; margin-left: -500px; align-items: center; justify-content: center; gap: 4px; padding: 0; text-align: center; transition: opacity 0.6s; }
  .seg.one.fade { opacity: 0; }
  .seg.one .txt { font-size: 32px; font-weight: 600; line-height: 1.15; flex: none; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: none; }   /* altid én linje */
  .seg.one .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-size: 18px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; flex: none; }
  .seg.one .sub.joke { font-size: 24px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent); }
  .seg.one .sub:empty { display: none; }
  /* hele baren bruger samme skrift og tykkelse (600) som aktiviteterne */
  .seg.one .lb { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; flex: none; }
  .seg.one .dots { display: flex; gap: 8px; margin-left: 14px; }
  .seg.one .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.35; }
  .seg.one .dots i.on { background: var(--accent); opacity: 1; }
  .txt .who { color: var(--muted); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== Bunden: 3 familiebilleder fra Google Fotos ===== */
  #bottom { position: absolute; left: 16px; right: 16px; top: 775px; bottom: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .cellb { min-width: 0; min-height: 0; display: flex; }
  .cellb .frame { flex: 1; }
  /* Vejret i dag i 2 tidsrum – i baren helt til højre */
  .wx { position: absolute; right: 38px; top: 0; bottom: 0; display: flex; align-items: center; gap: 40px; }
  .wx .slot { display: flex; flex-direction: column; align-items: center; gap: 2px; transition: opacity 2s; }
  .wx .h { font-size: 24px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; white-space: nowrap; }
  .wx .r { display: flex; align-items: center; gap: 10px; font-size: 40px; font-weight: 600; line-height: 1; }
  .wx .slot.past { opacity: 0.35; }   /* tidsrum, der er overstået */
  .wx .slot.cur .h { color: var(--accent); }   /* tidsrummet lige nu */
  .wr { flex: 1; display: flex; align-items: center; border-top: 1px solid var(--line); }
  .wr:first-child { border-top: 0; }
  .wr .wh { font-size: 26px; font-weight: 800; color: var(--soft); white-space: nowrap; }
  .wr .wi { flex: 1; display: flex; justify-content: center; }   /* ikonet midt mellem klokkeslæt og temperatur */
  .wr .wtp { display: flex; flex-direction: column; align-items: center; line-height: 1.05; white-space: nowrap; }
  .wr .wtp b { font-size: 32px; font-weight: 700; }
  .wr .wtp span { font-size: 15px; font-weight: 600; color: var(--muted); }
  .frame { position: relative; min-width: 0; min-height: 0; border-radius: var(--r); overflow: hidden; background: #15130F;
    box-shadow: var(--shadow), 0 0 0 1px var(--line); }
  .pl { position: absolute; top: 0; right: 0; bottom: 0; left: 0; opacity: 0; transition: opacity 5s ease-in-out; }
  .pl.show { opacity: 1; }
  .pl.zoom .fg { animation: kb 10s ease-out forwards; }   /* langsom zoom ind, når billedet kommer frem */
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.06); } }
  .cbg { position: absolute; top: -30px; right: -30px; bottom: -30px; left: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; filter: blur(24px) brightness(0.7); }
  .fg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
  .pdate { position: absolute; right: 14px; bottom: 10px; font-size: 17px; font-weight: 600; letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.55);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85); }
  .pdate:empty { display: none; }
  /* Skoleskemaer lægger sig oven på to af billederne i de faste tidsrum */
  .sk { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 3; box-sizing: border-box; padding: 14px 10px 12px; display: flex; flex-direction: column;
    background: linear-gradient(rgba(var(--wood), 0.10), rgba(var(--wood), 0.10)), var(--bg); opacity: 0; transition: opacity 1s ease-in-out; }
  body.skema .sk.ready { opacity: 1; }
  .sk { top: -2px; right: -2px; bottom: -2px; left: -2px; }   /* dækker helt ud i kanten */
  body.skema #F0 .pl, body.skema #F2 .pl, body.skema #F0 .pdate, body.skema #F2 .pdate { visibility: hidden; transition: visibility 0s 1s; }   /* fotoet under skemaet skjules, så det ikke lyser igennem i kanten */
  body.skema #F0, body.skema #F2 { box-shadow: var(--shadow); }   /* ingen tynd kantlinje om skemaerne */
  .sk .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px 8px; }
  .sk .sh .label { color: var(--accent); }
  .sk .sh .when { display: none; }   /* ingen "I dag/I morgen" – dagen er markeret i skemaet */
  .sk .sh .when b { color: var(--text); font-weight: 600; }
  .sk table { flex: 1; width: 100%; border-collapse: collapse; table-layout: fixed; }
  .sk th { font-size: 17px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    padding: 4px 2px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  .sk th.tc { width: 54px; }
  .sk td { padding: 4px 0; vertical-align: middle; text-align: center; border-bottom: 1px solid var(--line); }
  .sk tr:last-child td { border-bottom: 0; }
  .sk td.tc { font-size: 17px; font-weight: 800; color: var(--accent); }
  .sk .f { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  .sk .f + .f { color: var(--soft); }
  /* højst 2 linjer pr. time: to fag = én linje hver, ét fag = højst 2 linjer */
  .sk .f { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sk td .f:nth-last-child(2), .sk td .f:nth-last-child(2) + .f { -webkit-line-clamp: 1; }
  .sk .on { background: rgba(var(--wood), 0.18); }
  .sk th.on { color: var(--accent); border-radius: var(--r-sm) var(--r-sm) 0 0; }
  .sk tr:last-child td.on { border-radius: 0 0 var(--r-sm) var(--r-sm); }

  /* ===== PIN-parring ===== */
  #pin { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; background: var(--bg); display: none; align-items: center; justify-content: center; cursor: default; }
  #pin.on { display: flex; }
  #pin form { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 640px; text-align: center; }
  #pin h1 { margin: 0; font-size: 48px; font-weight: 600; }
  #pin p { margin: 0; font-size: 24px; color: var(--soft); }
  #pin label { position: absolute; left: -9999px; }
  #pin input { width: 360px; font: inherit; font-size: 56px; letter-spacing: 18px; text-align: center; padding: 14px; border-radius: 16px;
    border: 2px solid rgba(var(--wood), 0.6); background: var(--chip); color: var(--text); }
  #pin input:focus { outline: 3px solid var(--accent); outline-offset: 3px; }
  #pin button { font: inherit; font-size: 28px; font-weight: 700; padding: 16px 48px; border-radius: 999px; border: 0;
    background: var(--accent); color: var(--bg); cursor: pointer; }
  #pin button:focus { outline: 3px solid var(--text); outline-offset: 3px; }
  #pinerr { min-height: 32px; font-size: 24px; color: #C0573F; }

  /* ===== Sort skærm om natten ===== */
  /* Hele skærmen sort, så TV'et ser slukket ud */
  #night { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483647; background: #000; display: none; cursor: none; }
  /* Skærmen går ikke længere helt i sort om natten – den bliver dæmpet til 80 % (se DIM_NIGHT nederst) */
</style>
</head>
<body class="dark">
<div id="stage">
  <canvas id="fx" width="1920" height="1080" aria-hidden="true"></canvas>


  <div id="top"><div id="week"></div></div>

  <div id="band">
    <div class="seg clk">
      <div id="clock">--:--</div>
    </div>
    <div class="seg one"><div class="lb"><span class="ico" id="i0"></span><span id="l0"></span><span class="dots" id="dots"></span></div><div class="txt" id="t0"></div><div class="sub" id="s0"></div></div>
    <div class="wx" id="wxrows"></div>
  </div>

  <div id="bottom">
    <div class="cellb"><div class="frame" id="F0"><div class="pl"><img class="cbg" alt=""><img class="fg" alt="Familiebillede"></div><div class="pl"><img class="cbg" alt=""><img class="fg" alt="Familiebillede"></div><div class="pdate"></div><div class="sk" id="sk1"></div></div></div>
    <div class="cellb"><div class="frame" id="F1"><div class="pl"><img class="cbg" alt=""><img class="fg" alt="Familiebillede"></div><div class="pl"><img class="cbg" alt=""><img class="fg" alt="Familiebillede"></div><div class="pdate"></div></div></div>
    <div class="cellb"><div class="frame" id="F2"><div class="pl"><img class="cbg" alt=""><img class="fg" alt="Familiebillede"></div><div class="pl"><img class="cbg" alt=""><img class="fg" alt="Familiebillede"></div><div class="pdate"></div><div class="sk" id="sk2"></div></div></div>
  </div>

  <div id="deco" aria-hidden="true"></div>
  <div class="glow"></div>

  <div id="pin">
    <form id="pinform" autocomplete="off">
      <h1>Aktivér skærmen</h1>
      <p>Indtast PIN-koden én gang. Skærmen husker den bagefter.</p>
      <label for="pininput">PIN-kode</label>
      <input id="pininput" type="password" inputmode="numeric" maxlength="8" autofocus>
      <button type="submit">Aktivér</button>
      <div id="pinerr" role="alert"></div>
    </form>
  </div>
</div>
<div id="night"></div>

<script>
/* ===== Indstillinger ===== */
/* ===== Adresse til Apps Script (data og adgang) =====
 * Indsæt din Apps Script-adresse (den, der slutter på /exec) mellem anførselstegnene. */
var API = 'https://script.google.com/macros/s/AKfycbygCo2Wc5WCNT6ab9fO5DvyQwtqq48vngrlGhoupX1DaT6JVp6QT2rZqZp4Q3h2RYMqbw/exec';
var QS = new URLSearchParams(location.search);
var KEY = QS.get('k') || (function () { try { return localStorage.getItem('fs_key') || ''; } catch (e) { return ''; } })();
try { if (KEY) localStorage.setItem('fs_key', KEY); } catch (e) {}
var URL_TOKEN = QS.get('t') || '';
var LAT = 55.49, LON = 9.47;          // Kolding
var PHOTO_SECONDS = 120;             // alle tre billeder skifter samtidig hvert 2. minut (fade 5 sek., zoom 10 sek.)
var STRIP_SECONDS = 60;               // båndet tjekker hvert minut og skifter hvert 10. minut mellem de 5 slags indslag
var STRIP_MINUTES = 10;               // hvor længe hvert indslag står (samme vits, citat osv. hele dagen – nye ved midnat)
// Sort skærm om natten. days = de aftener, det gælder fra (0 = søndag … 6 = lørdag). '24:00' = fra midnat.
var NIGHT = [
  { days: [0, 1, 2, 3, 4], from: '22:00', to: '06:00' },   // søndag–torsdag aften: sort 22–06
  { days: [5, 6],          from: '24:00', to: '08:00' }    // fredag og lørdag: sort 00–08
];
var THEME = 'mørk';                   // 'mørk' (anbefalet), 'lys' eller 'auto' (lyst fra solopgang til solnedgang)
// Sæsontemaer (farver, lille hilsen og diskret animation). Sæt false for at slå et tema fra.
var SEASONS = { fodselsdag: true, halloween: true, jul: true, nytaar: true, paaske: true, fastelavn: true,
                sankthans: true, skolestart: true, sommerferie: true };
var SEASON_ANIMATION = true;          // sne til jul, gnister til nytår osv.
// ===== Skoleskemaer – vises på de to billedpladser nederst i tidsrummene herunder =====

function drawDeco(kind) {

  var W = 1920, H = 1080, M = 4, out = '';
  // Punkt på rammen (afstand t langs kanten) + indadvendt normal
  var L = 2 * (W - 2 * M) + 2 * (H - 2 * M);
  function edge(t) {
    t = ((t % L) + L) % L;
    var a = W - 2 * M, b = H - 2 * M;
    if (t < a) return { x: M + t, y: M, nx: 0, ny: 1 };
    t -= a; if (t < b) return { x: W - M, y: M + t, nx: -1, ny: 0 };
    t -= b; if (t < a) return { x: W - M - t, y: H - M, nx: 0, ny: -1 };
    t -= a; return { x: M, y: H - M - t, nx: 1, ny: 0 };
  }
  // Punkt på en kæde, der hænger i små buer (sag = hvor dybt den hænger)
  function sagPt(t, sag) {
    var e = edge(t), s = sag * Math.sin(Math.PI * ((((t % 150) + 150) % 150) / 150));
    return { x: e.x + e.nx * s, y: e.y + e.ny * s, nx: e.nx, ny: e.ny };

    var pts = '';

  }
  // Kæde hele vejen rundt; item() tegnes for hvert "led" (drejet, så det hænger indad)
  var K = 0.6;   // pynten er gjort mindre og ligger tæt på kanten, så den ikke dækker indholdet
  function frameGarland(item, spacing, sag, cable) {
    sag *= K; spacing *= K;
    cablePath(sag, cable || 'rgba(200,190,170,0.40)');
    for (var u = spacing / 2, n = 0; u < L; u += spacing) {
      var p = sagPt(u, sag), ang = Math.atan2(p.ny, p.nx) * 180 / Math.PI - 90;
      out += '<g transform="translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ') rotate(' + ang.toFixed(0) + ') scale(' + K + ')">' + item(n++) + '</g>';

  function frameUpright(item, spacing, inset) {

    for (var u = spacing / 2, n = 0; u < L; u += spacing) {

  if (kind === 'fir') {        // jul: grangren hele vejen rundt med røde og guld kugler og små varme lys
    var dark = '', light = '';
    for (var t = 0; t < L; t += 4) {

/* ===== Diskret sæson-animation (lavt CPU-forbrug, 30 fps) ===== */
var FX = (function () {
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d'), parts = [], mode = null, last = 0, raf = null;
  var COUNT = { snow: 70, embers: 26, sparkle: 40, petals: 26, confetti: 40, bubbles: 22 };
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function make(top) {
    var p = { x: rnd(0, 1920), y: top ? rnd(-1080, 0) : rnd(0, 1080), s: rnd(1.5, 4), v: rnd(0.3, 1), w: rnd(0, 6.28), a: rnd(0.25, 0.7) };
    if (mode === 'embers') { p.y = top ? rnd(1080, 1300) : rnd(0, 1080); p.s = rnd(1.5, 3); }
    if (mode === 'bubbles') { p.y = top ? rnd(1080, 1300) : rnd(0, 1080); p.s = rnd(5, 14); p.a = rnd(0.15, 0.35); }
    if (mode === 'confetti' || mode === 'petals') { p.c = ['#E9A9C9', '#E7CB5F', '#9CC7A3', '#8FB8E8', '#F0B48A'][Math.floor(rnd(0, 5))]; p.s = rnd(3, 6); }
    return p;
  }
  function step(t) {
    raf = requestAnimationFrame(step);
    if (t - last < 33) return;
    last = t;
    ctx.clearRect(0, 0, 1920, 1080);
    parts.forEach(function (p, i) {
      p.w += 0.02;
      if (mode === 'snow') { p.y += p.v * 1.2; p.x += Math.sin(p.w) * 0.4; ctx.fillStyle = 'rgba(255,255,255,' + p.a + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.28); ctx.fill(); }
      else if (mode === 'bubbles') { p.y -= p.v * 0.6; p.x += Math.sin(p.w) * 0.5; ctx.strokeStyle = 'rgba(255,245,220,' + p.a + ')'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.28); ctx.stroke(); }
      else if (mode === 'embers') { p.y -= p.v * 0.8; p.x += Math.sin(p.w) * 0.5; ctx.fillStyle = 'rgba(238,148,69,' + (p.a * (0.6 + 0.4 * Math.sin(p.w * 3))) + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.28); ctx.fill(); }
      else if (mode === 'sparkle') { var o = Math.max(0, Math.sin(p.w * 2)) * p.a; ctx.fillStyle = 'rgba(232,199,126,' + o + ')'; ctx.fillRect(p.x - p.s / 2, p.y - 0.6, p.s * 1.6, 1.2); ctx.fillRect(p.x + p.s * 0.3 - 0.6, p.y - p.s * 0.8, 1.2, p.s * 1.6); }
      else { p.y += p.v * 0.9; p.x += Math.sin(p.w) * 0.6; ctx.save(); ctx.globalAlpha = p.a; ctx.fillStyle = p.c; ctx.translate(p.x, p.y); ctx.rotate(p.w);
             if (mode === 'petals') { ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s / 2, 0, 0, 6.28); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
      if (p.y > 1100 || p.y < -1100 || ((mode === 'embers' || mode === 'bubbles') && p.y < -20)) parts[i] = make(true);
    });
  }
  return { start: function (m) {
    mode = m; parts = [];
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    ctx.clearRect(0, 0, 1920, 1080);
    if (!m) return;
    for (var i = 0; i < COUNT[m]; i++) parts.push(make(false));
    raf = requestAnimationFrame(step);
  } };
})();

/* ===== Tema ===== */
var SUN = { rise: '07:00', set: '17:00' };
function applyTheme() {
  var t = THEME;
  if (t === 'auto') { var n = hhmm(new Date()); t = (n >= SUN.rise && n < SUN.set) ? 'lys' : 'mørk'; }
  document.body.classList.toggle('light', t === 'lys');
  document.body.classList.toggle('dark', t !== 'lys');
}

/* ===== Sort skærm om natten ===== */
function isNight() {
  var now = new Date(), t = hhmm(now);
  var wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short' }).format(now));
  return NIGHT.some(function (n) {
    return (t >= n.from && n.days.indexOf(wd) >= 0) || (t < n.to && n.days.indexOf((wd + 6) % 7) >= 0);
  });
}

/* ===== Ur ===== */
function tick() {
  var night = isNight();
  if (night !== document.body.classList.contains('night')) {
    document.body.classList.toggle('night', night);
    if (!night) { SEASON = null; nextStrip(); renderCalendar(); }   // vågn op: frisk sæson, bånd og kalender
    else FX.start(null);
  }
  if (night) { $('clock').textContent = hhmm(new Date()); return; }   // om natten: kun uret kører, resten står stille
  pixelShift();
  applyTheme();
  if (new Date().getSeconds() === 0 || !SEASON) applySeason();
  var now = new Date();
  $('clock').textContent = hhmm(now);
  if (hhmm(now) === '00:00' && now.getSeconds() < 2) renderCalendar();   // ny dag
  else if (now.getSeconds() === 0) {
    if (now.getMinutes() % 5 === 0) renderCalendar();   // flytter NU-linjen og nedtoner det, der er slut
    else { var nl = document.querySelector('.nowline'); if (nl) nl.textContent = 'NU ' + hhmm(now); }
  }
  if (hhmm(now) === '03:00' && now.getSeconds() < 2) location.reload();
  checkSchedule();   // skift præcis på klokkeslæt
}

/* ===== Kalender: 7 dage fra kant til kant, i dag først ===== */
var EVENTS = [], WEATHER = null;
var WD3 = ['SØN', 'MAN', 'TIR', 'ONS', 'TOR', 'FRE', 'LØR'];
function weekdayOf(d) {
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short' }).format(d));
}
// Hvem aftalen gælder: Mor, Far, Lasse og Emil fjernes fra teksten, hvor de end står, og vises som farvede bogstaver.
// 'og', '+', '&', ',' og '/' mellem navnene fjernes også. 'PRO' først i titlen giver Mors bogstav (PRO bliver stående).
// 'Far og Emil: Svømning' → (F)(E) Svømning · 'Kør Emil og Lasse til svømning' → (E)(L) Kør til svømning · uden navn: som den er.
var PERSON_COLORS = { Mor: '#E25555', Far: '#4A8FE0', Lasse: '#45B067', Emil: '#F28C28' };
function whoOf(ev) {
  var t = String(ev.title).trim(), names = Object.keys(PERSON_COLORS), found = [];
  var NAME = '(?:' + names.join('|') + ')', B1 = '(?<![\\wæøåÆØÅ])', B2 = '(?![\\wæøåÆØÅ])';
  var SEP = '\\s*(?:,|&|\\+|/|og(?![\\wæøåÆØÅ]))\\s*';
  var group = new RegExp(B1 + NAME + B2 + '(?:' + SEP + NAME + B2 + ')*', 'gi');
  if (/^PRO(?![\wæøåÆØÅ])/i.test(t)) found.push('Mor');
  t = t.replace(group, function (m) {
    (m.match(new RegExp(NAME, 'gi')) || []).forEach(function (x) {
      var nm = names.filter(function (n) { return n.toLowerCase() === x.toLowerCase(); })[0];
      if (found.indexOf(nm) < 0) found.push(nm);
    });
    return ' ';
  });
  if (!found.length) return null;
  t = t.replace(/\s{2,}/g, ' ')
       .replace(/^\s*(?:[:\-–,&+\/]|og(?![\wæøå]))\s*/i, '').replace(/\s*(?:[:\-–,&+\/]|(?<![\wæøå])og)\s*$/i, '')
       .replace(/\s+([:,.])/g, '$1').trim();
  return { names: found, rest: t ? cap(t) : '' };
}
function isDinner(ev) {   // aftensmad = starter kl. 18.00 og slutter senest kl. 19.00
  if (ev.allDay || !ev.end) return false;
  var mins = (ev.end - ev.start) / 60000;
  return hhmm(new Date(ev.start)) === '18:00' && mins > 0 && mins <= 60;
}
function renderCalendar() {
  var now = new Date(), byDay = {}, seen = {};
  EVENTS.forEach(function (ev) {
    var id = String(ev.title).trim().toLowerCase() + '|' + ev.start + '|' + ev.allDay;   // samme aftale kun én gang
    if (seen[id]) return; seen[id] = true;
    var k = dayKey(new Date(ev.start)); (byDay[k] = byDay[k] || []).push(ev);
  });
  Object.keys(byDay).forEach(function (k) { byDay[k].sort(function (a, b) { return a.start - b.start; }); });   // altid i tidsrækkefølge
  var week = $('week'); week.innerHTML = '';
  for (var i = 0; i < 6; i++) {   // 6 dage: 3 øverst, 3 nederst
    var d = addDays(now, i), key = dayKey(d), col = el('div', 'day' + (i === 0 ? ' today' : '') + (i > 0 && !(byDay[key] || []).length ? ' free' : '')), head = el('div', 'dh');
    var dl = el('div', 'dl');
    dl.appendChild(el('div', 'nm', i === 0 ? 'I DAG' : WD3[weekdayOf(d)]));
    dl.appendChild(el('div', 'num', parseInt(key.slice(8), 10) + '/' + parseInt(key.slice(5, 7), 10)));   // fx 5/11
    head.appendChild(dl);
    var w = WEATHER && WEATHER[key];
    if (w) {   // vejr i overskriften: ikon og kun højeste temperatur
      var dwi = el('div', 'dwi');
      dwi.innerHTML = svg(w.icon, 32, ICON_COLORS[w.icon] || 'currentColor', 2);
      var tt = el('div', 'tt');
      tt.appendChild(el('b', null, w.max + '°'));
      head.appendChild(dwi); head.appendChild(tt);
    }
    col.appendChild(head);
    var all = byDay[key] || [], nowAfter = null;
    var evs = all;
    if (!evs.length && i === 0) col.appendChild(el('div', 'empty', 'Ingen aftaler'));
    evs.forEach(function (ev) {
      var e = el('div', 'ev' + (isDinner(ev) ? ' dinner' : '') + (i === 0 && !ev.allDay && (ev.end || ev.start + 3600000) <= now.getTime() ? ' past' : ''));
      var dinner = isDinner(ev), who = dinner ? null : whoOf(ev);
      e.appendChild(el('span', 'tm', ev.allDay ? '' : hhmm(new Date(ev.start))));   // 1. klokkeslæt
      var ic = el('span', 'ic');                                                     // 2. bogstaver / bestik
      if (dinner) { var b0 = el('span', 'who'); b0.innerHTML = svg('utensils', 18, '#1B1A18', 2.4); ic.appendChild(b0); }
      else if (who) who.names.forEach(function (n) { var b = el('span', 'who', n.charAt(0)); b.style.background = PERSON_COLORS[n]; ic.appendChild(b); });
      e.appendChild(ic);
      e.appendChild(el('span', 'x', who ? (who.rest || '') : ev.title));             // 3. hvad det er
      col.appendChild(e);
      if (i === 0 && !ev.allDay && ev.start <= now.getTime()) nowAfter = e;   // NU-linjen kommer efter den seneste aftale, der er gået i gang
    });
    if (i === 0) {
      var nl = el('div', 'nowline', 'NU ' + hhmm(now));
      if (nowAfter) col.insertBefore(nl, nowAfter.nextSibling); else col.insertBefore(nl, head.nextSibling);
    }
    week.appendChild(col);
    // vis så mange aftaler, der er plads til – resten som "+2 mere"
    var more = null, cut = 0;
    while (col.scrollHeight > col.clientHeight + 1) {
      var last = col.querySelectorAll('.ev');
      if (!last.length) break;
      last[last.length - 1].remove(); cut++;
      if (!more) { more = el('div', 'more'); col.appendChild(more); }
      more.textContent = '+' + cut + ' mere';
    }
  }
}

/* ===== Vejr (Open-Meteo, gratis) – 7 dage i kalenderen ===== */
function wInfo(code) {
  if (code <= 1) return ['sun', code === 0 ? 'Klart' : 'Mest klart'];
  if (code <= 3) return ['cloud', code === 2 ? 'Delvis skyet' : 'Overskyet'];
  if (code <= 48) return ['cloud', 'Tåge'];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['snow', 'Sne'];
  if (code >= 95) return ['rain', 'Torden'];
  if (code >= 80) return ['rain', 'Byger'];
  return ['rain', 'Regn'];
}
function loadWeather() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&hourly=weather_code,temperature_2m,wind_speed_10m' +
    '&wind_speed_unit=ms&timezone=Europe%2FCopenhagen&forecast_days=7')
  .then(function (r) { return r.json(); }).then(function (w) {
    WEATHER = {};
    w.daily.time.forEach(function (t, i) {
      WEATHER[t] = { icon: wInfo(w.daily.weather_code[i])[0], max: Math.round(w.daily.temperature_2m_max[i]), min: Math.round(w.daily.temperature_2m_min[i]) };
    });
    SUN.rise = w.daily.sunrise[0].slice(11, 16);
    SUN.set = w.daily.sunset[0].slice(11, 16);
    HOURLY = w.hourly || null;
    applyTheme();
    renderCalendar();
    renderWx();
  }).catch(function () {});
}

/* ===== Vejret i 3 tidsrum: 8–12, 12–16, 16–20 (efter kl. 20: i morgen) ===== */
var HOURLY = null, WX_SLOTS = [[8, 14], [14, 20]];   // 2 tidsrum i dag
function renderWx() {
  var box = $('wxrows'); if (!HOURLY) return;
  var now = new Date(), H = parseInt(hhmm(now).slice(0, 2), 10);
  var day = dayKey(now), nowKey = dayKey(now) + 'T' + hhmm(now).slice(0, 2) + ':00';
  box.innerHTML = '';
  // 2 tidsrum i dag: ikon og højeste temperatur – det overståede tidsrum nedtones
  WX_SLOTS.forEach(function (sl) {
    var codes = {}, tmax = null, n = 0;
    HOURLY.time.forEach(function (t, i) {
      var h = parseInt(t.slice(11, 13), 10);
      if (t.slice(0, 10) !== day || h < sl[0] || h >= sl[1]) return;
      var c = wInfo(HOURLY.weather_code[i])[0];
      codes[c] = (codes[c] || 0) + 1;
      if (tmax == null || HOURLY.temperature_2m[i] > tmax) tmax = HOURLY.temperature_2m[i];
      n++;
    });

/* ===== Båndet: tre felter med dagens vits · citat/kloge ord · vidste du/tanke ===== */
var stripStep = 0, stripDay = null;

var STRIP_LISTS = { joke: JOKES, fact: FACTS, quoteDk: QUOTES_DK, quoteW: QUOTES_WORLD };

function stripSlot() { return Math.floor(Date.now() / (STRIP_MINUTES * 60000)); }

}
function hasItem(k) { return !!stripItem(k); }

/* ===== 3 familiebilleder fra Google Fotos (Drive-mappen) – alle skifter samtidig hvert minut ===== */
var PHOTOS = [], pIndex = 0, SHOWING = [null, null, null], photosStarted = false;
var MONTHS = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function photoDate(name) {   // '20240714-001.jpg' → '2024' (kun årstallet)
  var m = /^(\d{4})\d{4}-/.exec(name || '');

}
function loadImage(id) {

    var src = 'data:' + p.mime + ';base64,' + p.data;
    return new Promise(function (res) {

      img.onload = function () { res({ id: id, src: src, name: p.name || '' }); };

}
function nextIds() {   // 3 nye billeder, ikke de samme som dem, der står nu

    if (out.indexOf(id) < 0 && (SHOWING.indexOf(id) < 0 || PHOTOS.length <= 3)) out.push(id);

}
var nextSet = null, loadingSet = null;

  return loadingSet;

function showSet() {

}

/* ===== Skoleskemaer på billedpladserne i de faste tidsrum ===== */
var schedOn = false, schedDay = -1;
var DAY_SHORT = ['Man', 'Tir', 'Ons', 'Tor', 'Fre'], DAY_LONG = ['mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag'];
function weekdayNow() {
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short' }).format(new Date()));
}
function isScheduleTime() {
  var wd = weekdayNow(), t = hhmm(new Date());
  if (!SCHEDULE_TIMES.some(function (w) { return w.days.indexOf(wd) >= 0 && t >= w.from && t < w.to; })) return false;
  return !schoolFree(scheduleDay().key);   // ingen skemaer, når næste skoledag er en fridag
}
function scheduleDay() {   // om formiddagen: i dag – om eftermiddagen/aftenen: næste skoledag (0 = mandag)
  var wd = weekdayNow(), am = hhmm(new Date()) < '12:00';
  var ahead = am ? 0 : 1, d = (wd + ahead) % 7;
  while (d === 0 || d === 6) { ahead++; d = (wd + ahead) % 7; }   // weekend → mandag
  return { i: d - 1, today: ahead === 0, key: dayKey(addDays(new Date(), ahead)) };
}

  if (SCHOOL_HOLIDAYS.some(function (h) { return key >= h.start && key <= h.end; })) return true;
  var y = parseInt(key.slice(0, 4), 10), e = easterUTC(y), t = Date.parse(key + 'T00:00:00Z');
  var free = [39, 40, 50].map(function (n) { return e + n * D1; });   // Kristi himmelfart, fredagen efter, 2. pinsedag
  return free.indexOf(t) >= 0 || key.slice(5) === '06-05';            // grundlovsdag
}
function renderSchedules() {
  var day = scheduleDay();

  [['sk1', SCHEDULE_SPOTS[0]], ['sk2', SCHEDULE_SPOTS[1]]].forEach(function (spot) {

}

<!-- ===== Dæmpet skærm: 10 % om dagen, 50 % de 2 timer før natten, 80 % om natten (aldrig helt sort) ===== -->
<div id="dimOverlay" style="position:fixed;inset:0;background:#000;opacity:0.1;pointer-events:none;z-index:99998;transition:opacity 60s linear;"></div>
<script>
(function () {
  var DIM_MINUTES = 120;    // hvor længe før sort skærm den kraftige dæmpning starter
  var DIM_DAY     = 0.1;   // 10 % dæmpet om dagen
  var DIM_EVENING = 0.5;   // 50 % dæmpet de 2 timer før natten
  var DIM_NIGHT   = 0.8;   // 80 % dæmpet om natten (tiderne står i NIGHT øverst)
  var ZONE        = 'Europe/Copenhagen';
  var WEEK        = 7 * 1440;

  function toMin(s) { var p = s.split(':'); return (+p[0]) * 60 + (+p[1]); }

  function nowWeekMinutes() {
    var parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: ZONE, weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date());
    var get = function (t) { return parts.filter(function (x) { return x.type === t; })[0].value; };
    var wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(get('weekday'));
    return wd * 1440 + (+get('hour')) * 60 + (+get('minute'));
  }

  function isEvening() {
    if (typeof NIGHT === 'undefined') return false;
    var w = nowWeekMinutes();
    return NIGHT.some(function (r) {
      return r.days.some(function (d) {
        var start = d * 1440 + toMin(r.from);
        var diff = ((w - (start - DIM_MINUTES)) % WEEK + WEEK) % WEEK;
        return diff < DIM_MINUTES;
      });
    });
  }

  function update() {
    var el = document.getElementById('dimOverlay');
    var night = typeof isNight === 'function' && isNight();
    if (el) el.style.opacity = night ? DIM_NIGHT : (isEvening() ? DIM_EVENING : DIM_DAY);
  }

  update();
  setInterval(update, 30000);
})();
</script>
